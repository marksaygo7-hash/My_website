<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To My Cutie Girl</title>
    <style>
        :root {
            --primary-red: #ff4d6d;
            --soft-pink: #fff0f3;
            --deep-rose: #c9184a;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle, var(--soft-pink) 0%, #f7cad0 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        /* Floating Hearts Layer */
        .bg-heart {
            position: absolute;
            color: var(--primary-red);
            opacity: 0.4;
            pointer-events: none;
            z-index: 1;
        }

        /* The Main Card */
        .card {
            background: var(--white);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(255, 77, 109, 0.2);
            text-align: center;
            z-index: 10;
            max-width: 380px;
            width: 85%;
            border: 2px solid #ffccd5;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heart-main {
            font-size: 60px;
            margin-bottom: 10px;
            display: inline-block;
            animation: beat 1s infinite alternate;
        }

        h1 { color: var(--deep-rose); font-size: 1.8rem; margin-bottom: 5px; }
        h2 { color: var(--primary-red); font-size: 1.5rem; margin-top: 0; font-style: italic; }
        
        p { color: #666; font-size: 1.1rem; line-height: 1.5; }

        .btn {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
            transition: 0.3s;
        }

        .btn:hover { background: var(--deep-rose); transform: scale(1.05); }

        /* The Hidden Message Overlay */
        #message-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(201, 24, 74, 0.95);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            flex-direction: column;
            padding: 20px;
        }

        .special-text {
            font-size: 2.2rem;
            max-width: 600px;
            line-height: 1.4;
            animation: fadeInDown 0.8s ease;
        }

        .close-btn {
            margin-top: 30px;
            background: white;
            color: var(--deep-rose);
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="heart-main">❤️</div>
        <h1>Hi! Good Evessssss.</h1>
        <h2>soyaaaaaaaa</h2>
        <p>I have simple message to tell you...</p>
        <button class="btn" onclick="revealMessage()">Click for Love</button>
    </div>

    <div id="message-overlay">
        <div class="special-text">
           <h2> "Jane-lou Mendigo,<br>
            I'm proud of how far you've come. Keep believing in yourself because every step you take brings you closer to your dreams. I'm always cheering for you." ❤️ </h2>
        </div>
        <button class="close-btn" onclick="hideMessage()">Back to Card</button>
    </div>

    <script>
        // Reveal the hidden message
        function revealMessage() {
            document.getElementById('message-overlay').style.display = 'flex';
        }

        // Hide it again
        function hideMessage() {
            document.getElementById('message-overlay').style.display = 'none';
        }

        // Floating background hearts logic
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            
            const duration = Math.random() * 3 + 5;
            heart.style.transition = `all ${duration}s linear`;
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.style.transform = `translateY(-110vh) rotate(${Math.random() * 360}deg)`;
                heart.style.opacity = '0';
            }, 50);

            setTimeout(() => { heart.remove(); }, duration * 1000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
